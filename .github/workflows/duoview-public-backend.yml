name: DuoView proven prototype stabilization
on:
  push:
    branches: [experiments/duoview-working-prototype-stability-v13]
    paths: ['duoview/**', '!duoview/*.md', 'duoview/TESTING.md', '.github/workflows/duoview-public-backend.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoview-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-injector:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
      - uses: actions/checkout@v4
        with:
          repository: praydog/UEVR
          ref: 4ee5c6b6162dee2291fc75f9dfc57667f6d45a2d
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: elliotttate/UESDK-RenderDoc
          ref: 418729025bad57b094bf6b2e2b55734454c97de6
          path: backend/dependencies/submodules/UESDK
      - name: Public submodules and calibrated Mono port
        shell: pwsh
        run: |
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Public submodule checkout failed' }
          python workspace/duoview/apply_public_mono.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Mono port failed' }
          python workspace/duoview/apply_public_duoview.py backend
          if ($LASTEXITCODE -ne 0) { throw 'DuoView integration failed' }
          python workspace/duoview/test_working_stability.py
          if ($LASTEXITCODE -ne 0) { throw 'Present-path regression failed' }
          python workspace/duoview/apply_working_stability.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Working prototype stabilization failed' }
          python -c "from pathlib import Path; s=Path('backend/src/mods/vr/D3D12Component.cpp').read_text(); b=s.split('void D3D12Component::on_post_present(VR* vr) {')[1].split('void D3D12Component::on_reset(')[0]; assert 'return;' not in b and 'm_graphics_memory->Commit(command_queue);' in b and '!defer_backbuffer_clear' in b; print('Verified actual patched DX12 Present source')"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Present source validation failed' }
          git -C backend diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed' }
      - name: Portable policies and production DX12 WARP compositor
        shell: pwsh
        run: |
          cmake -S workspace/duoview -B tests -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          cmake --build tests --config Release --target DuoViewGeometryTests DuoViewGazeTests DuoViewFrameTests DuoViewConfigTests DuoViewStateTests DuoViewProductionWarpTests
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          ctest --test-dir tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Regression or WARP GPU test failed' }
      - name: Configure full Windows backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release *> configure.log
          $code = $LASTEXITCODE
          Get-Content configure.log | Select-Object -Last 80
          if ($code -ne 0) { throw "Configure failed ($code)" }
      - name: Compile full DLL and support libraries
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log | Select-Object -Last 160
          if ($code -ne 0) { throw "Full Windows backend compilation failed ($code)" }
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build matching Mono injector
        shell: pwsh
        run: |
          python workspace/duoview/apply_frontend.py frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend patch failed' }
          dotnet run --project frontend/tests/RenderingModes --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Frontend method ID tests failed' }
          dotnet publish frontend/UEVR/UEVR.csproj --output package --configuration Release --self-contained true
          if ($LASTEXITCODE -ne 0) { throw 'Frontend compilation failed' }
          Copy-Item backend/build/bin/uevr/* package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          'Source: https://github.com/liviutrn/OpenNR/tree/${{ github.sha }}' | Set-Content package/BUILD_SOURCE.txt
          if (Test-Path workspace/duoview/TESTING.md) { Copy-Item workspace/duoview/TESTING.md package/ }
          Copy-Item workspace/duoview/STABILITY_V13.md package/STABILITY_V13.md
          Copy-Item backend/LICENSE package/UEVR-LICENSE.txt
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 300 | Set-Content package/HASHES.txt
      - name: Upload complete experimental injector
        uses: actions/upload-artifact@v4
        with:
          name: DuoView-Experimental-Windows-Injector-${{ github.run_number }}
          path: package/
          if-no-files-found: error
          retention-days: 30
      - name: Publish Injector-5 stabilization candidate
        if: ${{ success() && github.ref == 'refs/heads/experiments/duoview-working-prototype-stability-v13' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path package/* -DestinationPath DuoView-Working-Prototype-Stability.zip
          $tag='duoview-working-prototype-stability-v13-build-${{ github.run_number }}'
          @'
          DuoView user-tested Injector-5 renderer preserved, with one targeted
          DX12 post-present allocation-retirement correction.
          All original shared-pose real UE views, foveated compositor and PSVR2
          gaze remain source-identical. Does not use Build 69's external hooks.
          Windows CI passing is a controlled release gate, not proof of smooth
          headset behavior or boot stability. Read STABILITY_V13.md.
          Source: ${{ github.sha }}
          Windows CI: https://github.com/liviutrn/OpenNR/actions/runs/${{ github.run_id }}
          '@ | Set-Content release-notes.md
          gh release create $tag DuoView-Working-Prototype-Stability.zip --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "DuoView proven renderer stabilization — build ${{ github.run_number }}" --prerelease --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Diagnostics and applied source
        if: always()
        shell: pwsh
        run: |
          git -C backend diff --binary | Set-Content applied-source.patch
          git -C backend/dependencies/submodules/UESDK diff --binary | Set-Content applied-sdk.patch
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuoView-public-backend-build-logs-${{ github.run_number }}
          path: |
            configure.log
            build.log
            applied-source.patch
            applied-sdk.patch
          if-no-files-found: warn
