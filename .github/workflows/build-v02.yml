name: Build OpenNR 2.20.1-v02

on:
  push:
    branches: ["build/2.20.1-v02"]
  workflow_dispatch:

concurrency:
  group: opennr-v02-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build OpenNR 2.20.1-v02 checkpoint
    runs-on: windows-2025
    steps:
      - name: Check out v02 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify source contract
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '2.20.1') { throw "Expected VERSION 2.20.1, got $version" }
          @(
            'runtime/open-shaders/CMakePresets.json',
            'runtime/open-shaders/vcpkg.json',
            'patches/2.20.1-v00-gaze-history.patch',
            'scripts/v01/apply-v00-base.ps1',
            'scripts/v01/apply-settings.ps1',
            'scripts/v01/apply-gaze-sequential.ps1',
            'scripts/v01/apply-gaze-sequential-fixed3.ps1',
            'scripts/v01/apply-sequential-renderer.ps1',
            'scripts/v01/apply-sequential-renderer-fixed2.ps1',
            'scripts/v01/apply-pass2-composite.ps1',
            'scripts/v01/apply-stereo-atlas.ps1',
            'scripts/v01/apply-stereo-atlas-fixed2.ps1',
            'scripts/v01/apply-atlas-safety.ps1',
            'scripts/v01/apply-ui.ps1',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/SequentialCompositeCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/StereoAtlasPackColorCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/StereoAtlasPackDepthCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/StereoAtlasPackMotionCS.hlsl',
            'scripts/v01/permit-carrier-excluded.ps1',
            'scripts/v02/README.md',
            'scripts/v02/apply-gaze-stability.ps1',
            'scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1',
            'scripts/v02/apply-sharpening.ps1',
            'scripts/v02/apply-sharpening-fixed.ps1',
            'scripts/v02/apply-sharpening-fixed2.ps1',
            'scripts/v02/apply-sharpening-fixed3.ps1'
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing v02 input: $_" } }
          git diff --check

      - name: Reconstruct v00 gaze-history base
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/apply-v00-base.ps1

      - name: Apply v01 settings contracts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/apply-settings.ps1

      - name: Apply v01 gaze and sequential route
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/apply-gaze-sequential-fixed3.ps1

      - name: Apply validated v01 renderer stages
        shell: pwsh
        run: |
          @(
            'scripts/v01/apply-sequential-renderer-fixed2.ps1',
            'scripts/v01/apply-pass2-composite.ps1',
            'scripts/v01/apply-stereo-atlas-fixed2.ps1',
            'scripts/v01/apply-atlas-safety.ps1',
            'scripts/v01/apply-ui.ps1'
          ) | ForEach-Object {
            Write-Host "Applying $_"
            pwsh -NoProfile -File $_
            if ($LASTEXITCODE -ne 0) { throw "v01 transformation failed: $_" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Transformed v01 source has whitespace errors' }

      - name: Restore v00 gaze stability with configurable dead zone
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v02/apply-gaze-stability.ps1
          if ($LASTEXITCODE -ne 0) { throw 'v02 gaze stability transform failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Transformed v02 gaze source has whitespace errors' }

      - name: Apply atlas-motion and compact-P2 repairs
        shell: pwsh
        run: |
          @(
            'scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1'
          ) | ForEach-Object {
            Write-Host "Applying $_"
            pwsh -NoProfile -File $_
            if ($LASTEXITCODE -ne 0) { throw "v02 regression transform failed: $_" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Transformed v02 renderer source has whitespace errors' }

      - name: Apply v02 verified NR sharpening
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v02/apply-sharpening-fixed3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'v02 sharpening transform failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Transformed v02 sharpening source has whitespace errors' }
          git diff --stat

      - name: Permit carrier-excluded CI package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/permit-carrier-excluded.ps1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git checkout $baseline
          & .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and package
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          cmake --preset OpenNR-Package "-DDIST_PATH=$dist"
          cmake --build --preset Package --parallel

      - name: Mark v02 integrated checkpoint
        shell: pwsh
        run: |
          @(
            'OpenNR 2.20.1-v02 — integrated regression-fix checkpoint',
            '',
            'Base: validated OpenNR 2.20.1-v01 transformation chain.',
            '',
            'v02 corrections in this package:',
            '- v00-style hard-hold gaze crop restored;',
            '- configurable 1% to 10% eye-axis gaze dead zone, default 2%;',
            '- atlas crop-motion compensation no longer inherits dormant per-eye reset flags;',
            '- reduced sequential pass 2 uses pass-aware native Feature18 handle dimensions;',
            '- reduced pass 2 fails closed from atlas to corrected independent-eye stereo;',
            '- before-NR / after-NR RCAS sharpening is wired at the Feature18 boundary;',
            '- sharpening user range is 0.0 to 3.0 and maps safely to RCAS 0..1.',
            '',
            'nvngx_dlssnr.dll is intentionally carrier-excluded from this public artifact.',
            'Use the validated carrier from an existing licensed OpenNR installation.'
          ) | Set-Content -Path dist\README-2.20.1-v02.txt

      - name: List output and hashes
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Format-Table FullName,Length
          Get-ChildItem -Recurse dist -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash)  $($_.FullName)"
          } | Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Upload v02 checkpoint package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-2.20.1-v02-carrier-excluded
          path: dist/*
          if-no-files-found: error
          retention-days: 14
