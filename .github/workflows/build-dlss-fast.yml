name: OpenNR fast DLSS DLL

on:
  push:
    branches:
      - "dev/dlss-fast"
    paths:
      - "runtime/open-shaders/src/Features/Upscaling/**"
      - "runtime/open-shaders/cmake/Streamline/**"
      - "runtime/open-shaders/cmake/NVAPI/**"
      - "runtime/open-shaders/CMakeLists.txt"
      - "runtime/open-shaders/CMakePresets.json"
      - "runtime/open-shaders/vcpkg.json"
      - ".github/workflows/build-dlss-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opennr-dlss-fast
  cancel-in-progress: true

jobs:
  dll:
    name: Optimized CommunityShaders.dll only
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out development source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          ninjaVersion: latest
          useCloudCache: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore persistent compile/dependency/runtime cache
        id: fast-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-fast
            .cache/vcpkg
            vcpkg
            external-runtime
          key: opennr-dlss-fast-v9-${{ runner.os }}-${{ hashFiles('runtime/open-shaders/vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            opennr-dlss-fast-v9-${{ runner.os }}-${{ hashFiles('runtime/open-shaders/vcpkg.json') }}-
            opennr-dlss-fast-v8-${{ runner.os }}-${{ hashFiles('runtime/open-shaders/vcpkg.json') }}-

      - name: Ensure exact working DLSS-NR 310.8.0 carrier
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "external-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $dll = Join-Path $runtimeDir "nvngx_dlssnr.dll"
          $expectedDll = "E16BCF15E16E13F527491CDF7845B2FE6521A738D8F7C9C721866A8496E1FC8E"
          $valid = $false
          if (Test-Path $dll) {
            $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToUpperInvariant()
            $valid = ($hash -eq $expectedDll) -and ((Get-Item $dll).Length -eq 165840496)
          }
          if (-not $valid) {
            $zip = Join-Path $runtimeDir "nvngx_dlssnr_310.8.0.zip"
            $url = "https://github.com/RankFTW/rhi-repo/releases/download/dlssnr-310.8.0/nvngx_dlssnr_310.8.0.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($zipHash -ne "388C0A7912E15EC911B9C9E11A692142B11FE387DDF2B637D8C358138FFFB3AC") {
              throw "DLSS-NR archive SHA-256 mismatch: $zipHash"
            }
            $extract = Join-Path $runtimeDir "extract"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $found = Get-ChildItem $extract -Recurse -File -Filter "nvngx_dlssnr.dll" | Select-Object -First 1
            if (-not $found) { throw "nvngx_dlssnr.dll not found after extraction" }
            Copy-Item $found.FullName $dll -Force
          }
          $dllHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($dllHash -ne $expectedDll) { throw "DLSS-NR DLL SHA-256 mismatch: $dllHash" }
          if ((Get-Item $dll).Length -ne 165840496) { throw "Unexpected DLSS-NR DLL size" }
          "OPENNR_DLSSNR_RUNTIME_SOURCE=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified exact working nvngx_dlssnr.dll: $dllHash"

      - name: Bootstrap pinned vcpkg only when needed
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not (Test-Path (Join-Path $vcpkg ".git"))) {
            if (Test-Path $vcpkg) { Remove-Item $vcpkg -Recurse -Force }
            git clone https://github.com/microsoft/vcpkg.git $vcpkg
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          }
          Push-Location $vcpkg
          git checkout --force $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline checkout failed" }
          if (-not (Test-Path ".\vcpkg.exe")) {
            & .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
          Pop-Location
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure optimized DLL-only build
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build-fast"
          cmake --preset OpenNR-Package -B "$build" `
            "-DOPENNR_DLSSNR_RUNTIME_SOURCE=$env:OPENNR_DLSSNR_RUNTIME_SOURCE" `
            -DSKIP_RUNTIME_DOWNLOADS=ON `
            -DZIP_TO_DIST=OFF `
            -DAIO_ZIP_TO_DIST=OFF `
            -DBUILD_SHADER_TESTS=OFF `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile only CommunityShaders.dll
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build-fast"
          cmake --build "$build" --target CommunityShaders --parallel
          if ($LASTEXITCODE -ne 0) { throw "DLL build failed" }

      - name: Show compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Stage drop-in test DLL
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build-fast"
          $stage = Join-Path $env:GITHUB_WORKSPACE "fast-artifact\SKSE\Plugins"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $dll = Get-ChildItem $build -Recurse -File -Filter "CommunityShaders.dll" |
            Where-Object { $_.FullName -notmatch "vcpkg_installed|_deps" } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $dll) { throw "CommunityShaders.dll not found" }
          Copy-Item $dll.FullName (Join-Path $stage "CommunityShaders.dll") -Force

          $pdb = Get-ChildItem $build -Recurse -File -Filter "CommunityShaders.pdb" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "vcpkg_installed|_deps" } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName (Join-Path $stage "CommunityShaders.pdb") -Force }

          $sha256 = (Get-FileHash (Join-Path $stage "CommunityShaders.dll") -Algorithm SHA256).Hash
          @"
          OpenNR fast optimized DLL build
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Target: CommunityShaders only
          Configuration: Release optimized, no LTO
          Full package generation: skipped
          DLSS-NR carrier used only to satisfy/validate the original build contract; not included in artifact.
          Carrier SHA-256: E16BCF15E16E13F527491CDF7845B2FE6521A738D8F7C9C721866A8496E1FC8E
          DLL SHA-256: $sha256

          Install for testing by replacing only:
          SKSE/Plugins/CommunityShaders.dll
          in the verified OpenNR 2.15.1 installation.
          "@ | Set-Content (Join-Path $env:GITHUB_WORKSPACE "fast-artifact\BUILD_INFO.txt") -Encoding utf8

      - name: Upload drop-in DLL
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-DLSS-FAST-${{ github.run_number }}-${{ github.sha }}
          path: fast-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Save persistent compile/dependency/runtime cache
        if: always() && steps.fast-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-fast
            .cache/vcpkg
            vcpkg
            external-runtime
          key: opennr-dlss-fast-v9-${{ runner.os }}-${{ hashFiles('runtime/open-shaders/vcpkg.json') }}-${{ github.sha }}
