name: Build OpenNR 2.20.1-v04

on:
  push:
    branches: ["build/2.20.1-v04"]
  workflow_dispatch:

concurrency:
  group: opennr-v04-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build OpenNR 2.20.1-v04 checkpoint
    runs-on: windows-2025
    steps:
      - name: Check out v04 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify source contract
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne '2.20.1') { throw 'Wrong base version' }
          @(
            'scripts/v01/apply-v00-base.ps1','scripts/v01/apply-settings.ps1',
            'scripts/v01/apply-gaze-sequential-fixed3.ps1','scripts/v01/apply-sequential-renderer-fixed2.ps1',
            'scripts/v01/apply-pass2-composite.ps1','scripts/v01/apply-stereo-atlas-fixed2.ps1',
            'scripts/v01/apply-atlas-safety.ps1','scripts/v01/apply-ui.ps1','scripts/v01/permit-carrier-excluded.ps1',
            'scripts/v02/apply-gaze-stability.ps1','scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1','scripts/v02/apply-sharpening-fixed4.ps1',
            'scripts/v03/prepare-controller-contract.ps1','scripts/v03/apply-adaptive-relative-crop.ps1',
            'scripts/v03/apply-gaze-fixation-stability.ps1','scripts/v03/apply-sharpness-range.ps1',
            'scripts/v03/apply-smart-frametime-controller-fixed.ps1',
            'scripts/v04/apply-unified-frametime-controller.ps1','scripts/v04/apply-unified-frametime-controller-fixed.ps1',
            'scripts/v04/apply-atlas-adaptive-safety.ps1'
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing input: $_" } }
          git diff --check

      - name: Reconstruct validated v00-v02 chain
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v01/apply-v00-base.ps1
          if ($LASTEXITCODE) { throw 'v00 failed' }
          pwsh -NoProfile -File scripts/v01/apply-settings.ps1
          if ($LASTEXITCODE) { throw 'v01 settings failed' }
          pwsh -NoProfile -File scripts/v01/apply-gaze-sequential-fixed3.ps1
          if ($LASTEXITCODE) { throw 'v01 gaze/sequential failed' }
          @(
            'scripts/v01/apply-sequential-renderer-fixed2.ps1','scripts/v01/apply-pass2-composite.ps1',
            'scripts/v01/apply-stereo-atlas-fixed2.ps1','scripts/v01/apply-atlas-safety.ps1','scripts/v01/apply-ui.ps1',
            'scripts/v02/apply-gaze-stability.ps1','scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1','scripts/v02/apply-sharpening-fixed4.ps1'
          ) | ForEach-Object {
            Write-Host "Applying $_"
            pwsh -NoProfile -File $_
            if ($LASTEXITCODE) { throw "Transform failed: $_" }
          }
          git diff --check
          if ($LASTEXITCODE) { throw 'Inherited transformed source has whitespace errors' }

      - name: Reconstruct retained v03 non-controller changes
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v03/prepare-controller-contract.ps1
          if ($LASTEXITCODE) { throw 'controller contract cleanup failed' }
          pwsh -NoProfile -File scripts/v03/apply-adaptive-relative-crop.ps1
          if ($LASTEXITCODE) { throw 'relative adaptive crop failed' }
          pwsh -NoProfile -File scripts/v03/apply-gaze-fixation-stability.ps1
          if ($LASTEXITCODE) { throw 'gaze fixation stability failed' }
          pwsh -NoProfile -File scripts/v03/apply-sharpness-range.ps1
          if ($LASTEXITCODE) { throw 'extended sharpness failed' }
          git diff --check

      - name: Reconstruct v03 controller substrate
        shell: pwsh
        run: |
          # v04 replaces the policy completely, but these generated fields are
          # retained as a stable transform substrate so no validated v03 gaze,
          # crop, sharpening, or integration work is reimplemented by hand.
          pwsh -NoProfile -File scripts/v03/apply-smart-frametime-controller-fixed.ps1
          if ($LASTEXITCODE) { throw 'v03 controller substrate failed' }
          git diff --check

      - name: Apply v04 unified frametime controller
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v04/apply-unified-frametime-controller-fixed.ps1
          if ($LASTEXITCODE) { throw 'v04 unified controller failed' }
          pwsh -NoProfile -File scripts/v04/apply-atlas-adaptive-safety.ps1
          if ($LASTEXITCODE) { throw 'v04 atlas adaptive safety failed' }
          git diff --check
          if ($LASTEXITCODE) { throw 'v04 transformed source has whitespace errors' }
          git diff --stat

      - name: Verify v04 generated-source invariants
        shell: pwsh
        run: |
          $policy = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/RuntimePolicy.h -Raw
          $fov = Get-Content runtime/open-shaders/src/Features/Upscaling/FoveatedRender.cpp -Raw
          $fovh = Get-Content runtime/open-shaders/src/Features/Upscaling/FoveatedRender.h -Raw
          $integration = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/Integration.cpp -Raw
          $renderer = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/Renderer.cpp -Raw
          $gaze = Get-Content runtime/open-shaders/src/Features/Upscaling/GazeCropPolicy.h -Raw
          $shader = Get-Content runtime/open-shaders/features/Upscaling/Shaders/Upscaling/RCAS/RCAS.hlsl -Raw

          if ($policy -notmatch 'kFullResolutionNeuralRenderingOnly = false') { throw 'Adaptive runtime policy unexpectedly relocked' }
          if ($fovh -notmatch 'adaptiveCropTargetCoverage') { throw 'Unified crop target state missing' }
          if ($fov -notmatch '\[DLSSNR\]\[ADAPTIVE-v04\]') { throw 'v04 controller body missing' }
          if ($fov -notmatch '\[DLSSNR\]\[BUDGET-v04\]') { throw 'v04 budget diagnostics missing' }
          if ($fov -match 'adaptiveController\.Update\(') { throw 'Old model-resolution controller still makes adaptive decisions' }
          if ($fov -match '\[DLSSNR\]\[BUDGET\]') { throw 'Old v03 budget controller survived rewrite' }
          if ($integration -notmatch 'adaptiveEligible && settings\.neuralRenderingAdaptiveEnabled &&\s*foveated\.adaptivePassInitialized') { throw 'Integration not keyed to unified controller state' }
          if ($integration -notmatch 'adaptiveActivePasses > 0 \? std::min\(foveated\.adaptiveActivePasses - 1u, 2u\)') { throw '1/2/3 pass wiring missing' }
          if ($integration -notmatch 'adaptiveActivePasses == 0') { throw 'Zero-pass emergency bypass missing' }
          if ($integration -notmatch 'tuning\.adaptiveResolution = false') { throw 'Adaptive model-resolution flag not disabled' }
          if ($integration -notmatch 'tuning\.temporalReuseCadence = 0;\s*\r?\n\s*tuning\.temporalReuseStaggerEyes = false;') { throw 'Atlas temporal safety override missing' }
          if ($renderer -notmatch 'passCount >= 1 && passCount <= 2 && !tuning\.adaptiveResolution') { throw 'Expected atlas compatibility guard changed unexpectedly' }
          if ($fov -notmatch 'settings\.neuralRenderingStereoAtlas \?\s*std::min\(manualPasses, 2u\) : manualPasses') { throw 'Atlas pass cap missing' }
          if ($gaze -notmatch 'microPixels' -or $gaze -match '> 2\.0f\)\s*\r?\n\s*return sample') { throw 'Validated gaze fixation contract regressed' }
          if ($shader -notmatch 'deltaBoost = max\(sharpness, 1\.0\)') { throw 'Extended sharpness mapping regressed' }
          if ($integration -match 'keep cropped/foveated regions on the established single-pass route') { throw 'Old crop/sequential restriction returned' }

      - name: Permit carrier-excluded package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/permit-carrier-excluded.ps1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git checkout $baseline
          & .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and package
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          cmake --preset OpenNR-Package "-DDIST_PATH=$dist"
          cmake --build --preset Package --parallel

      - name: Add v04 package notes and hashes
        shell: pwsh
        run: |
          @(
            'OpenNR 2.20.1-v04',
            'Base: working v03 ca7522b40db57253b9a75efade8c2ff4deb927aa',
            'Controller rewrite: one SteamVR application-GPU frametime policy controls sequential NR pass count and crop size relative to the user-selected crop.',
            'Fast degradation / slow recovery, spike rejection, cooldown, configurable pass-cost estimate, and emergency zero-NR floor.',
            'Stereo atlas remains native during adaptive control: adaptive model-resolution and temporal-reuse flags are held off; atlas supports adaptive 2 -> 1 -> 0 NR operation.',
            'v03 gaze-fixation and sharpness 0..3 changes are retained.',
            'nvngx_dlssnr.dll is carrier-excluded by design.'
          ) | Set-Content dist\README-2.20.1-v04.txt
          Get-ChildItem -Recurse dist -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash)  $($_.FullName)"
          } | Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Upload v04 checkpoint package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-2.20.1-v04-carrier-excluded
          path: dist/*
          if-no-files-found: error
          retention-days: 14
