name: QuadView Joey public source audit
on:
  push:
    branches:
      - experiments/joey-quadview-nativepairs-p0-20261017
    paths:
      - '.github/workflows/quadview-source-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect-public-joey-render-hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          path: backend
          persist-credentials: false
      - name: Print bounded original public render-hook source context
        shell: python
        run: |
          from pathlib import Path
          file=Path("backend/src/mods/vr/FFakeStereoRenderingHook.cpp")
          lines=file.read_text(encoding="utf-8",errors="replace").splitlines()
          slices=[
            (5720,5760), (9220,9245),(12305,12425),
            (20680,20755),(20920,21080),(22600,22740),
            (23175,23320),(25215,25355),
            (30815,30940),(31325,31395)
          ]
          for low,high in slices:
            print(f"========== ORIGINAL JOEY HOOK LINES {low}-{high}, total {len(lines)} ==========")
            for i in range(low-1,min(high,len(lines))):
              print(f"{i+1:05d} {lines[i]}")
          print("========== SOURCE LENGTH VERIFIED ==========")
          assert len(lines)>31000
      - name: Report completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'quadview/public-joey-source-audit',
              description: 'Original pinned public Joey source hook audit: ${{ job.status }}',
              target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
