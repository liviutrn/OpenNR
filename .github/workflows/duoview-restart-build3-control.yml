name: Build3 stable-source mask control
run-name: Pinned Build3 control validation (${{ github.run_number }})
on:
  push:
    branches: [experiments/duoview-restart-build3-baseline]
    paths:
      - '.github/workflows/duoview-restart-build3-control.yml'
      - 'duoview/restart/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoview-restart-build3-control-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  pinned-build3-control:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 0
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify complete pushed restart-source snapshot
        shell: pwsh
        run: |
          python workspace/duoview/restart/source_snapshot_manifest.py --verify workspace
          if ($LASTEXITCODE -ne 0) { throw 'Pushed restart source files differ from the recorded local snapshot' }
      - name: Prepare evidence and run patcher unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          python workspace/duoview/restart/tests/test_backend_patch.py *> evidence/patcher-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/patcher-tests.log
          if ($code -ne 0) { throw "Patch safety tests failed ($code)" }
      - name: Check out original public backend submodules
        shell: pwsh
        run: |
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
      - name: Verify exact unmodified Build3 source before patching
        shell: pwsh
        run: |
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact Build3 source identity or completeness verification failed' }
      - name: Apply reviewed adapter to the pinned backend and record hashes
        shell: pwsh
        run: |
          $manifest=Join-Path $env:RUNNER_TEMP 'duoview-backend-patch-manifest.json'
          python workspace/duoview/restart/apply_backend_patch.py --backend backend --workspace workspace --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Pinned backend patch application failed' }
          Copy-Item $manifest evidence/backend-patch-manifest.json
      - name: Build portable replay and patch-safety tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview/restart -B workspace/duoview/restart/build -G 'Visual Studio 17 2022' -A x64 *> evidence/restart-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/restart-configure.log | Select-Object -Last 40
          if ($code -ne 0) { throw "Restart test configuration failed ($code)" }
          cmake --build workspace/duoview/restart/build --config Release --parallel 2 *> evidence/restart-build.log
          $code=$LASTEXITCODE; Get-Content evidence/restart-build.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Restart tests failed to compile ($code)" }
          ctest --test-dir workspace/duoview/restart/build -C Release --output-on-failure --no-tests=error *> evidence/restart-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/restart-tests.log
          if ($code -ne 0) { throw "Restart tests failed ($code)" }
      - name: Build and run D3D12 WARP stable-source compositor tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview/restart/tests -B workspace/duoview/restart/warp-build -G 'Visual Studio 17 2022' -A x64 *> evidence/warp-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/warp-configure.log | Select-Object -Last 40
          if ($code -ne 0) { throw "D3D12 WARP test configuration failed ($code)" }
          cmake --build workspace/duoview/restart/warp-build --config Release --parallel 2 --target stable_source_mask_d3d12_tests *> evidence/warp-build.log
          $code=$LASTEXITCODE; Get-Content evidence/warp-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw "D3D12 WARP tests failed to compile ($code)" }
          ctest --test-dir workspace/duoview/restart/warp-build -C Release --output-on-failure --no-tests=error *> evidence/warp-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/warp-tests.log
          if ($code -ne 0) { throw "D3D12 WARP tests failed ($code)" }
          if (Select-String -Path evidence/warp-tests.log -Pattern 'Skipped|skipped') {
            throw 'D3D12 WARP validation is blocked/skipped; it is not a pass.'
          }
      - name: Configure original compatibility tests and production backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DUEVR_BUILD_COMPATIBILITY_TESTS=ON *> evidence/configure.log
          $code=$LASTEXITCODE; Get-Content evidence/configure.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Pinned backend configuration failed ($code)" }
      - name: Build every original compatibility-test target
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --parallel 2 --target compatibility-policy-tests steam-frame-input-tests stock-frame-migration-tests gamepad-recovery-tests kananlib-decode-window-tests diagnostic-safety-tests prospi-camera-trace-tests prospi-camera-framing-tests prospi-celebration-framing-tests prospi-roof-visibility-tests hifi-hook-memory-tests nascar-hook-compatibility-tests input-hook-installation-tests mono-d3d11-tests mono-d3d12-tests ui-alpha-tests ui-alpha-lifecycle-tests ui-composition-tests lua-fname-binding-tests lua-context-dispatch-tests lua-controller-input-tests stalker2-native-policy-tests stalker2-native-d3d12-tests *> evidence/test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Pinned compatibility tests failed to compile ($code)" }
      - name: Run the complete original compatibility suite
        shell: pwsh
        run: |
          ctest --test-dir backend/build -C Release --output-on-failure --no-tests=error *> evidence/compatibility-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/compatibility-tests.log
          if ($code -ne 0) { throw "Pinned compatibility tests failed ($code)" }
      - name: Build pinned backend and auxiliary DLLs
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> evidence/backend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Pinned backend failed to compile ($code)" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test and build matching original frontend
        shell: pwsh
        run: |
          dotnet run --project frontend/tests/RenderingModes --configuration Release *> evidence/frontend-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-tests.log
          if ($code -ne 0) { throw 'Original rendering-ID tests failed' }
          dotnet publish frontend/UEVR/UEVR.csproj --output package --configuration Release *> evidence/frontend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-build.log | Select-Object -Last 60
          if ($code -ne 0) { throw 'Matching original frontend failed to compile' }
      - name: Verify generated backend patch after all builds
        shell: pwsh
        run: |
          $manifest=Join-Path $env:RUNNER_TEMP 'duoview-backend-patch-manifest.json'
          python workspace/duoview/restart/verify_backend_patch.py --backend backend --manifest $manifest *> evidence/backend-patch-verification.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-patch-verification.log
          if ($code -ne 0) { throw 'Backend patch files changed unexpectedly during build' }
      - name: Package experimental Build3 control
        if: success()
        shell: pwsh
        run: |
          Copy-Item backend/build/bin/uevr/*.dll package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json package/
          Copy-Item evidence/exact-baseline-source.json package/
          Copy-Item evidence/backend-patch-manifest.json package/
          Copy-Item workspace/duoview/restart/STATUS.md package/
          Copy-Item workspace/duoview/restart/EXPERIMENTS.md package/
          @'
          EXPERIMENTAL Build3 stable-source/moving-mask diagnostic control.
          The original Mono callback remains the default when UEVR_STABLE_SOURCE_MASK is unset or off.
          Set UEVR_STABLE_SOURCE_MASK to fixed, step, ramp, or alternating in the target game process environment before launching the game; setting it only in an injector process after the game starts has no effect.
          Optional Mono-path summaries: set UEVR_DUOVIEW_DIAGNOSTICS=1.
          Opt-in observations are exported to %LOCALAPPDATA%\UEVR\DuoViewRestart\stable-source-mask-<UTC>.jsonl, capped at 4,096 frame records per session.
          This uses one stable full-frustum Mono source for both eye outputs and does not save scene-render work.
          It is not DuoView, does not create a second engine view, and does not establish temporal stability.
          The first opted-in frame compiles/prepares the shader and is a warmup frame that falls back to Mono.
          No STALKER 2, PSVR2, OpenXR headset, or moving-gaze runtime validation is included in this artifact.
          '@ | Set-Content package/READ_FIRST.txt
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/package-sha256.json
          $zip="Joey-Build3-Stable-Source-Mask-${{ github.run_number }}.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Joey-Build3-Stable-Source-Mask-${{ github.run_number }}
          path: |
            Joey-Build3-Stable-Source-Mask-*.zip
            Joey-Build3-Stable-Source-Mask-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Record source and backend submodule provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule status | Set-Content evidence/submodules.txt
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json evidence/ -ErrorAction SilentlyContinue
          Copy-Item backend/build/Testing/Temporary/LastTest.log evidence/ -ErrorAction SilentlyContinue
          $global:LASTEXITCODE=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Joey-Build3-control-evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: error

