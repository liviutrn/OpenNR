name: Build custom PSVR2Toolkit driver

on:
  push:
    branches:
      - psvr2-render-target-override
    paths:
      - '.github/workflows/psvr2toolkit-custom.yml'
      - 'tools/patch_psvr2toolkit_custom.py'
      - 'tools/patch_psvr2_height_2174.py'
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  PSVR2_COMMIT: 5daea3856fda4399bbe61b7f9bc872ea7b321a43

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Clone exact PSVR2Toolkit source
        shell: pwsh
        run: |
          git clone --recursive https://github.com/BnuuySolutions/PSVR2Toolkit.git psvr2toolkit
          cd psvr2toolkit
          git checkout $env:PSVR2_COMMIT
          git submodule update --init --recursive

      - name: Apply exact user custom patches
        shell: pwsh
        run: |
          python tools/patch_psvr2toolkit_custom.py
          python tools/patch_psvr2_height_2174.py

      - name: Configure
        shell: pwsh
        run: cmake -B psvr2toolkit/build -S psvr2toolkit -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE

      - name: Build driver only
        shell: pwsh
        run: cmake --build psvr2toolkit/build --config $env:BUILD_TYPE --target psvr2_openvr_driver_ex

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item psvr2toolkit/build/bin/$env:BUILD_TYPE/driver_playstation_vr2.dll artifact/driver_playstation_vr2.dll
          @'
          PSVR2Toolkit custom driver - render target override
          Base upstream commit: 5daea3856fda4399bbe61b7f9bc872ea7b321a43

          Preserved exactly from the user's prior custom DLL:
          - recovered nonlinear haptics gain LUT
          - right R2 half-range/semi-press remap
          - recovered 256-entry stick curve LUT, active-controller axes only

          Render-target override:
            "renderTargetOverride" : true,
            "renderTargetWidth" : 2568,
            "renderTargetHeight" : 2174

          Current Advanced FOV crop:
          - 80% total binocular horizontal FOV remaining
          - 10% total VFOV removed from top
          - 25% total VFOV removed from bottom

          The 2174 pre-crop height is based on the user's measured SteamVR transform:
          2268 -> 1924 under this crop (factor 0.848325).
          Target post-crop height: ~1844.
          Expected post-crop recommendation: approximately 2568 x 1844.

          Restart SteamVR completely after replacing the DLL, then verify with:
            hmdq.exe geom --openvr -v 1
          '@ | Set-Content -Encoding UTF8 artifact/README_RENDER_TARGET.txt

      - uses: actions/upload-artifact@v7
        with:
          name: PSVR2Toolkit_RenderTargetOverride_2174
          path: artifact
