name: DuoView engineering evidence export Build49
on:
  push:
    branches: [experiments/duoview-joey-first-v11]
    paths: ['.github/workflows/duoview-evidence-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact Build 49 source and CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/source audit/ci_build audit/ci_logs audit/metadata
          # Archive exactly the source from the successful Windows build,
          # not the HEAD that introduced this non-rendering export workflow.
          git archive 2d329de34e8fbca63ed66c92157bb7c56fd27f38 duoview .github/workflows/duoview-joey-plugin.yml | tar -xf - -C audit/source
          gh run download 38386479898 -R liviutrn/OpenNR -n DuoView-Joey-Preserved-Plugin-49 -D audit/ci_build
          gh run download 38386479898 -R liviutrn/OpenNR -n DuoView-Joey-plugin-build-logs-49 -D audit/ci_logs
          gh api --allow-escape-sequences repos/liviutrn/OpenNR/actions/jobs/115259491076/logs > audit/ci_logs/full_actions_job_115259491076.log
          gh api repos/liviutrn/OpenNR/actions/runs/38386479898 > audit/metadata/github_run_38386479898.json
          git rev-parse 2d329de34e8fbca63ed66c92157bb7c56fd27f38 > audit/metadata/compiled_source_sha.txt
          printf 'Build 49 source snapshot and CI artifacts, not in-game validated.\n' > audit/metadata/READ_ME_FIRST.txt
          (cd audit && find . -type f -print0 | sort -z | xargs -0 sha256sum) > audit/metadata/export_sha256.txt
          test -s audit/ci_build/Plugin/DuoViewJoey.dll
          test -s audit/ci_logs/plugin-build.log
          test -s audit/ci_logs/full_actions_job_115259491076.log
          echo 'DuoView evidence export complete'
      - uses: actions/upload-artifact@v4
        with:
          name: DuoView-Build49-ExactSource-And-CI
          path: audit/
          if-no-files-found: error
          retention-days: 30
