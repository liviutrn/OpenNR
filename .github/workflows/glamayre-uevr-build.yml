name: Glamarye OpenXR Multi-Radius Build v02
on:
  push:
    branches:
      - "experiments/glamayre-openxr-layer-v02-multiscale-timing"
    paths:
      - "glamayre-uevr/**"
      - ".github/workflows/glamayre-uevr-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S glamayre-uevr -B glamayre-uevr/build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build glamayre-uevr/build --config Release --parallel
      - name: Compile embedded HLSL with Windows D3D compiler
        run: ctest --test-dir glamayre-uevr/build -C Release --output-on-failure
      - name: Validate Khronos implicit layer manifest
        shell: pwsh
        run: |
          $m = Get-Content glamayre-uevr/layer/glamayre_openxr.json -Raw | ConvertFrom-Json
          if ($m.api_layer.name -ne 'XR_APILAYER_Glamarye_sharpen') { throw 'Bad OpenXR layer name' }
          if ($m.api_layer.library_path -ne '.\GlamaryeOpenXRLayer.dll') { throw 'Wrong manifest DLL path' }
          if ($m.api_layer.disable_environment -ne 'GLAMARYE_OPENXR_LAYER_DISABLE') { throw 'Missing mandatory implicit layer disable_environment' }
          Write-Host 'Khronos implicit API layer manifest passed'
      - name: Verify DLL exists
        shell: pwsh
        run: |
          $p = "glamayre-uevr/build/Release/GlamaryeSharpenUEVR.dll"
          if (!(Test-Path $p)) { throw "DLL missing: $p" }
          Write-Host "SHA256:"
          (Get-FileHash $p -Algorithm SHA256).Hash
      - name: Package UEVR plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force glamayre-uevr/package/plugins | Out-Null
          New-Item -ItemType Directory -Force glamayre-uevr/package/scripts | Out-Null
          Copy-Item glamayre-uevr/build/Release/GlamaryeSharpenUEVR.dll glamayre-uevr/package/plugins/
          Copy-Item glamayre-uevr/scripts/glamayre_sharpen.lua glamayre-uevr/package/scripts/
          New-Item -ItemType Directory -Force glamayre-uevr/package/layer | Out-Null
          Copy-Item glamayre-uevr/build/Release/GlamaryeOpenXRLayer.dll glamayre-uevr/package/layer/
          Copy-Item glamayre-uevr/layer/glamayre_openxr.json glamayre-uevr/package/layer/
          Copy-Item glamayre-uevr/install-layer.ps1 glamayre-uevr/package/
          Copy-Item glamayre-uevr/uninstall-layer.ps1 glamayre-uevr/package/
          Copy-Item glamayre-uevr/README.md glamayre-uevr/package/
          Copy-Item glamayre-uevr/LICENSE-GLAMARYE.txt glamayre-uevr/package/
      - uses: actions/upload-artifact@v4
        with:
          name: Glamarye-OpenXR-MultiRadius-v02
          path: glamayre-uevr/package/
          retention-days: 30
