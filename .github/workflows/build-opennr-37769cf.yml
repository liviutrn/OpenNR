name: Build OpenNR 2.15.1 VR revision

on:
  push:
    branches: ["codex/opennr-37769cf", "codex/opennr-run22-reviewed", "codex/opennr-run23-reviewed", "codex/opennr-run24-reviewed", "codex/opennr-run24-crop-deadzone-rollback-test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable OpenNR package
    runs-on: windows-2025
    steps:
      - name: Check out this build branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify source and package inputs
        shell: pwsh
        run: |
          @(
            "OpenNR-2.15.1-37769cf.patch",
            "runtime/open-shaders/CMakePresets.json",
            "runtime/open-shaders/vcpkg.json",
            "runtime/open-shaders/src/Features/Upscaling/FoveatedRender.cpp",
            "runtime/open-shaders/src/Features/Upscaling/NeuralRendering/Integration.cpp"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing required build input: $_" }
          }
          git diff --check
          git status --porcelain

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git checkout $baseline
          & .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          cmake --preset OpenNR-Package -DOPENNR_EXTERNAL_DLSSNR_RUNTIME=ON "-DDIST_PATH=$dist"

      - name: Build and run adaptive C++ tests
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          cmake --build --preset Package --target cpp_tests --parallel
          $testRoot = Join-Path $env:GITHUB_WORKSPACE "runtime/open-shaders/build/OpenNR-Package"
          $testExe = Get-ChildItem -Path $testRoot -Filter cpp_tests.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $testExe) { throw "cpp_tests.exe was not produced under $testRoot" }
          & $testExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "cpp_tests failed with exit code $LASTEXITCODE" }

      - name: Build package
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          cmake --build --preset Package --parallel

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-2.15.1-run24-crop-deadzone-rollback-test
          path: dist/*
          if-no-files-found: error
          retention-days: 14
