name: Build unchanged OpenNR 2.15.1 baseline b272d732

on:
  push:
    branches:
      - "build/opennr-2.15.1-b272d732"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build unchanged 2.15.1 package
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Check out exact baseline-derived branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify runtime source is unchanged from b272d732
        shell: pwsh
        run: |
          $baseline = "b272d732bd22d3ae6e320e03a5f06957492b916d"
          git cat-file -e "$baseline^{commit}"
          git diff --exit-code $baseline HEAD -- runtime/open-shaders tools VERSION README.md
          if ($LASTEXITCODE -ne 0) { throw "Baseline source differs from $baseline" }
          "OPENNR_BASELINE_SHA=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download exact working DLSS-NR 310.8.0 carrier
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "external-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $zip = Join-Path $runtimeDir "nvngx_dlssnr_310.8.0.zip"
          $url = "https://github.com/RankFTW/rhi-repo/releases/download/dlssnr-310.8.0/nvngx_dlssnr_310.8.0.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          $expectedZip = "388C0A7912E15EC911B9C9E11A692142B11FE387DDF2B637D8C358138FFFB3AC"
          if ($zipHash -ne $expectedZip) { throw "DLSS-NR archive SHA-256 mismatch: $zipHash" }

          Expand-Archive -Path $zip -DestinationPath $runtimeDir -Force
          $dll = Get-ChildItem $runtimeDir -Recurse -File -Filter "nvngx_dlssnr.dll" | Select-Object -First 1
          if (-not $dll) { throw "nvngx_dlssnr.dll not found after extraction" }

          $dllHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $expectedDll = "E16BCF15E16E13F527491CDF7845B2FE6521A738D8F7C9C721866A8496E1FC8E"
          if ($dllHash -ne $expectedDll) { throw "DLSS-NR DLL SHA-256 mismatch: $dllHash" }
          if ($dll.Length -ne 165840496) { throw "Unexpected DLSS-NR DLL size: $($dll.Length)" }

          "OPENNR_DLSSNR_RUNTIME_SOURCE=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified exact working nvngx_dlssnr.dll: $dllHash ($($dll.Length) bytes)"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          ninjaVersion: latest
          useCloudCache: false

      - name: Bootstrap pinned complete vcpkg checkout
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          Push-Location $vcpkg
          git checkout $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline checkout failed" }
          & .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure frozen release source unchanged
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $build = Join-Path $env:GITHUB_WORKSPACE "build-package"
          cmake --preset OpenNR-Package -B "$build" `
            "-DOPENNR_DLSSNR_RUNTIME_SOURCE=$env:OPENNR_DLSSNR_RUNTIME_SOURCE" `
            "-DDIST_PATH=$dist"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build frozen package
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build-package"
          cmake --build "$build" --target CommunityShaders Package-AIO-Manual --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Record build identity
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          @"
          OpenNR frozen baseline test build
          Compiled source commit: b272d732bd22d3ae6e320e03a5f06957492b916d
          Source version: 2.15.1
          C++/shader/runtime logic modifications: NONE
          DLSS-NR carrier SHA-256: E16BCF15E16E13F527491CDF7845B2FE6521A738D8F7C9C721866A8496E1FC8E
          DLSS-NR carrier size: 165840496 bytes
          Carrier source: RankFTW/rhi-repo dlssnr-310.8.0 (byte-identical to uploaded working package)
          "@ | Set-Content -Path (Join-Path $dist "BASELINE_BUILD_INFO.txt") -Encoding utf8

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-2.15.1-FROZEN-b272d732
          path: dist/*
          if-no-files-found: error
          retention-days: 30
