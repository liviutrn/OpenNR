name: DuoView v46 Validated UE5.6 Previous Clip Bridge — CANDIDATE
run-name: DuoView v46 crop temporal bridge Windows audit (${{ github.run_number }})
on:
  push:
    branches: [experiments/duoview-world-locked-temporal-v46]
    paths:
      - '.github/workflows/duoview-joey-stage234.yml'
      - 'duoview/joey_stage1/**'
      - 'duoview/DuoViewPSVR2Gaze.hpp'
      - 'duoview/DuoViewGaze.hpp'
      - 'duoview/DuoViewCropMotion.hpp'
      - 'duoview/DuoViewCropStability.hpp'
      - 'duoview/DuoViewState.hpp'
      - 'duoview/DuoViewTemporalMath.hpp'
      - 'duoview/DuoViewUE56Layout.hpp'
      - 'duoview/DuoViewSceneViewTemporal.hpp'
      - 'duoview/DuoViewHistoryCorrection.hpp'
      - 'duoview/tests/**'
      - 'duoview/CMakeLists.txt'
      - 'duoview/stage10_state_tests.cpp'
      - 'duoview/production_warp_test.cpp'
      - 'duoview/stage4_gaze_tests.cpp'
      - 'duoview/DuoViewConfig.hpp'
      - 'duoview/DuoViewD3D12.hpp'
      - 'duoview/DuoViewComposite.hlsl'
      - 'duoview/DuoViewCompositeRaster.hlsl'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoview-stage234-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  duoview-fixed-center-two-view:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 0
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify the unchanged exact source and public dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact source identity or completeness verification failed' }
      - name: Apply exact-anchor Stage 1 fallback patch
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply guarded DuoView Stage 1 edits' }
          python workspace/duoview/joey_stage1/verify_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source changes in DuoView Stage 1' }
      - name: Apply isolated two-view source changes
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 source anchors did not match original Joey' }
          python workspace/duoview/joey_stage1/apply_native_lowres_bootstrap.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Native low-res bootstrap source patch failed' }
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Build33 restoration + native bootstrap violated SDK/source boundaries' }
      - name: Preserve real generated Joey hook excerpts for independent audit
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/audit_generated.py backend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Generated source callback audit failed' }
      - name: Verify pinned production geometry and pair-state contracts
        shell: pwsh
        run: |
          cmake -S workspace/duoview/joey_stage1 -B duo_pinned_tests -G 'Visual Studio 17 2022' -A x64 "-DJOYEY_BACKEND_DIR=$((Resolve-Path backend).Path)" *> evidence/pinned-config.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-config.log | Select-Object -Last 40
          if ($code -ne 0) { throw "Pinned production test configuration failed ($code)" }
          cmake --build duo_pinned_tests --config Release --parallel 2 *> evidence/pinned-build.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw "Pinned production tests failed compilation ($code)" }
          ctest --test-dir duo_pinned_tests -C Release --output-on-failure --no-tests=error *> evidence/pinned-results.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-results.log
          if ($code -ne 0) { throw "Pinned production contract failed ($code)" }
      - name: Configure independent DuoView geometric, state, and GPU WARP tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview -B duo_tests -G 'Visual Studio 17 2022' -A x64 *> evidence/duo-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-configure.log | Select-Object -Last 50
          if ($code -ne 0) { throw "DuoView independent tests configuration failed ($code)" }
          cmake --build duo_tests --config Release --parallel 2 *> evidence/duo-test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "DuoView independent tests failed compilation ($code)" }
          ctest --test-dir duo_tests -C Release --output-on-failure --no-tests=error *> evidence/duo-test-results.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-results.log
          if ($code -ne 0) { throw "DuoView independent CPU/GPU tests failed ($code)" }
      - name: Configure original compatibility tests and production backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DUEVR_BUILD_COMPATIBILITY_TESTS=ON *> evidence/configure.log
          $code=$LASTEXITCODE; Get-Content evidence/configure.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Original Joey configuration failed ($code)" }
      - name: Build every test target used by the official matching build
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --parallel 2 --target compatibility-policy-tests steam-frame-input-tests stock-frame-migration-tests gamepad-recovery-tests kananlib-decode-window-tests diagnostic-safety-tests prospi-camera-trace-tests prospi-camera-framing-tests prospi-celebration-framing-tests prospi-roof-visibility-tests hifi-hook-memory-tests nascar-hook-compatibility-tests input-hook-installation-tests mono-d3d11-tests mono-d3d12-tests ui-alpha-tests ui-alpha-lifecycle-tests ui-composition-tests lua-fname-binding-tests lua-context-dispatch-tests lua-controller-input-tests stalker2-native-policy-tests stalker2-native-d3d12-tests *> evidence/test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original compatibility tests failed to compile ($code)" }
      - name: Run the complete original compatibility suite
        shell: pwsh
        run: |
          ctest --test-dir backend/build -C Release --output-on-failure --no-tests=error *> evidence/compatibility-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/compatibility-tests.log
          if ($code -ne 0) { throw "Original compatibility tests failed ($code)" }
      - name: Build original backend and auxiliary DLLs
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> evidence/backend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original latest Joey backend failed to compile ($code)" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test and build matching original frontend
        shell: pwsh
        run: |
          dotnet run --project frontend/tests/RenderingModes --configuration Release *> evidence/frontend-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-tests.log
          if ($code -ne 0) { throw 'Original rendering-ID tests failed' }
          dotnet publish frontend/UEVR/UEVR.csproj --output package --configuration Release *> evidence/frontend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-build.log | Select-Object -Last 60
          if ($code -ne 0) { throw 'Matching original frontend failed to compile' }
      - name: Verify final Stage 2-4 code identity and package
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence --final
          if ($LASTEXITCODE -ne 0) { throw 'DuoView Stage 2-4 source changed during the build' }
          Copy-Item backend/build/bin/uevr/*.dll package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json package/
          Copy-Item evidence/exact-baseline-source.json package/
          Copy-Item evidence/duoview-stage1-edits.json package/
          Copy-Item evidence/duoview-stage1-source-hashes.json package/
          Copy-Item evidence/duoview-stage234-hashes.json package/
          @'
          DUOVIEW v46 CANDIDATE: gaze-dependent high-resolution crop projection with the head camera held fixed.
          Gaze moves the foveal projection and crop together. The periphery and fovea retain the same head pose.
          Unreal receives the crop projection before scene rendering and should generate crop-aware motion vectors from its persistent per-view previous projection.
          DuoView does not add an OpenNR-style crop offset a second time: OpenNR corrects vectors after cropping a rendered image; here the crop is in Unreal's projection.
          The compositor maps cropped fovea samples back to full-view world coordinates. Moving the crop does not move stationary scene detail on the output.
          Foveal source pixel count/density settings and periphery render allocation remain unchanged; no extra render pass or resource readback.
          Tracked crop is a constant angular frustum; its outline can be perspective-shaped on the full Mono image away from center.
          Optional fixation guard holds only changes within one output pixel; larger movement is immediate, with no smoothing or velocity cap.
          Fixed-center Eye Tracking OFF centers the cropped projection; it does not steer a camera.
          Current typed FSceneViewInitOptions projection is reconciled at construction. v46 latches the exact current UE5.6 source origin/rotation, crop projection, source rect, Family and ViewState identity, then writes ClipToPrevClipOverride only through a layout-gated runtime bridge. The public UE5.6 layout proof is SceneView ClipToPrevClipOverride offset 0x12a0 with a 0x1330-byte SceneView mirror; every live check and matrix readback must pass or the write is refused.
          The bridge supplies inverse(current cropped view-projection) * previous cropped view-projection, so head motion and moving-ROI motion are both represented in Unreal's own previous-clip consumer. It does not write private TSR history, private velocity buffers, or a final-color displacement.
          The per-frame gate blocks eye-tracked composition unless the two source ViewStates are distinct and stable across adjacent producer frames AND both v46 UE5.6 overrides succeeded after the first frame. This is a source/layout/runtime-write proof only; it does NOT prove headset TSR consumed correct vectors.
          Actual STALKER2/PSVR2 motion-vector and image-stability acceptance is pending.
          Starting foundation: Build37 native0 low-scale bootstrap -> ID6 -> restore OpenXR scale AFTER accepted compositions.
          Backend: exact Joey 5ac7edc207866569334175e4ed8a7517971547f6 + guarded DuoView modifications.
          Restricted SDK unchanged: joeyhodge/UESDK 3cffbc82429b6165ceec2714f0f0d9ae48f55596.
          Matching frontend source: 60be4b0f9a646109fd9fdf448bacd41477234091, plus ID 6.
          Modes 0 and 5 are routed to ORIGINAL JOEY. Experimental mode ID6 is active ONLY in STALKER 2 DX12 OpenXR.
          ID6 restores persistent per-profile crop width/height, fovea density, peripheral scale, blend feather and gaze controls.
          Old source defaults: 0.50x0.50 crop at 1.0x density, 0.20x periphery, gaze ON, fovea UE0/periphery UE1.
          Press Restore old DuoView settings once if an existing profile retains newer settings. Increase density to match your old preferred tuning; exact historical tuning is unknown.
          Foveal atlas rectangle starts at x=0, matching Injector-5. Gaze uses the inverse left optical rotation, matching the old coordinate path.
          v46 tracks valid native gaze per producer frame without smoothing or velocity caps. The optional one-output-pixel fixation guard remains.
          Missing CAPI samples hold their original mapped coordinate for at most 50ms from sensor arrival; repeated reads do not refresh age. Blink/bad packets clear it immediately, then the crop returns to center.
          Both UE views use frozen producer data and the same head pose; only the high-resolution projection crop follows gaze. v46 supplies the previous cropped projection to the documented UE5.6 ClipToPrevClipOverride field, with a layout-gated fail-closed write.
          Optional temporal audit reports head-pose stability, distinct/persistent ViewStates, source-frame gaps, the history gate, and expected static-world crop motion in fovea-buffer pixels. It is diagnostic and OFF by default.
          Independent primary shading starts OFF on EACH injection/mode transition; toggle it in-game after DuoView settles.
          The shading toggle temporarily constructs the SECONDARY source as PRIMARY only with proven distinct source ViewStates and matching main family. It does not enable the full Native Fix capture/submission path.
          Toggle OFF to return to the existing shading path on the next producer frame. Actual shading parity and temporal stability require headset testing.
          Optional GPU timing is OFF by default. Query resources prewarm at swapchain creation; no GPU waits or render-callback allocation for timing.
          Debug source 0=blended output, 1=periphery only, 2=fovea only (dark outside ROI).
          Source view0 is the first UE pass (old prototype default), view1 is the second (Build19 default).
          Both source passes share exactly the same Mono head camera. In tracked mode only the high-resolution projection/crop follows gaze.
          Stage5 reads combined calibrated PSVR2 Toolkit CAPI gaze ONCE per frame. No DLL bundled.
          If CAPI is unavailable/invalid or blinked, ID6 stays at fixed center; no OpenXR gaze layer required.
          Menu shows whether PSVR2 gaze is fresh, center fallback, or Mono quarantine.
          Uses the same Mono head pose, moving off-axis foveal projection, DX12 raster composition and original XR submission.
          On failure, DuoView is QUARANTINED internally inside ID6; the next frame uses Joey original Mono.
          The fault frame attempts a current-frame original Mono copy but may show incomplete atlas contents.
          DXBC shaders are precompiled during CI; per-XR-image PSOs/textures are prewarmed on swapchain setup.
          Changing source formats or unexpected swapchain lifecycle may still cause reconstruction. Monitor frame pacing.
          Experimental: Source/test/CI passing cannot prove exact game GPU producer completion or headset stability.
          NEVER overwrite 30-minute-proven Build3! Extract this ZIP into a SEPARATE TEST DIRECTORY.
          Built-in gaze freshness/age counters are read from UI; crop motion is not manually added a second time to vectors.
          Stage5 gaze requires installed PSVR2 Toolkit CAPI and still requires headset calibration validation.
          Engine view order and optical gaze mapping are source verified. Actual Lumen/shadow/exposure and visual parity require a headset test; no gamma correction applied.
          The eye-tracked source/compositor and first-use pacing are NOT headset verified.
          '@ | Set-Content package/READ_FIRST.txt
          $needed=@('UEVRBackend.dll','UEVRPluginNullifier.dll','LuaVR.dll','READ_FIRST.txt','duoview-stage234-hashes.json','exact-baseline-source.json')
          foreach ($name in $needed) { if (!(Test-Path ("package/" + $name))) { throw "Missing critical package file: $name" } }
          if (@(Get-ChildItem package -File -Filter *.exe).Count -lt 1) { throw "Missing Joey frontend executable" }
          if ((Get-Content package/READ_FIRST.txt -Raw) -notmatch 'QUARANTINED internally') { throw 'Stale fallback instructions' }
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/package-sha256.json
          $zip="Joey-DuoView-MovingCrop-v46-${{ github.run_number }}.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256"
      - name: Independently verify final candidate ZIP, PE machine IDs and unpacked hashes
        shell: pwsh
        run: |
          $zip="Joey-DuoView-MovingCrop-v46-${{ github.run_number }}.zip"
          python workspace/duoview/joey_stage1/audit_v46_package.py package $zip evidence
          if ($LASTEXITCODE -ne 0) { throw 'v46 package provenance, PE or ZIP audit failed' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Joey-DuoView-MovingCrop-v46-${{ github.run_number }}
          path: |
            Joey-DuoView-MovingCrop-v46-*.zip
            Joey-DuoView-MovingCrop-v46-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Record public source and dependency provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule status | Set-Content evidence/submodules.txt
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json evidence/
          Copy-Item backend/build/Testing/Temporary/LastTest.log evidence/ -ErrorAction SilentlyContinue
          $global:LASTEXITCODE=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Joey-DuoView-FixedCenter-Evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: error
