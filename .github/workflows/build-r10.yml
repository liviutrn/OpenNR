name: Build OpenNR 2.20.1-v06-r10 stable

on:
  push:
    branches: ["build/2.20.1-v06-r10-stable"]
  workflow_dispatch:

concurrency:
  group: opennr-v06-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build OpenNR 2.20.1-v06 checkpoint
    runs-on: windows-2025
    steps:
      - name: Check out v05 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify source contract
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne '2.20.1') { throw 'Wrong base version' }
          @(
            'scripts/v01/apply-v00-base.ps1','scripts/v01/apply-settings.ps1',
            'scripts/v01/apply-gaze-sequential-fixed3.ps1','scripts/v01/apply-sequential-renderer-fixed2.ps1',
            'scripts/v01/apply-pass2-composite.ps1','scripts/v01/apply-stereo-atlas-fixed2.ps1',
            'scripts/v01/apply-atlas-safety.ps1','scripts/v01/apply-ui.ps1','scripts/v01/permit-carrier-excluded.ps1',
            'scripts/v02/apply-gaze-stability.ps1','scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1','scripts/v02/apply-sharpening-fixed4.ps1',
            'scripts/v03/prepare-controller-contract.ps1','scripts/v03/apply-adaptive-relative-crop.ps1',
            'scripts/v03/apply-gaze-fixation-stability.ps1','scripts/v03/apply-sharpness-range.ps1',
            'scripts/v03/apply-smart-frametime-controller-fixed.ps1',
            'scripts/v04/apply-unified-frametime-controller.ps1','scripts/v04/apply-unified-frametime-controller-fixed.ps1',
            'scripts/v04/apply-atlas-adaptive-safety.ps1',
            'scripts/v05/apply-simple-frametime-controller.ps1','scripts/v05/apply-simple-frametime-controller-fixed.ps1',
            'docs/versions/2.20.1-v05/README.md'
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing input: $_" } }
          git diff --check

      - name: Reconstruct validated v00-v02 chain
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v01/apply-v00-base.ps1
          if ($LASTEXITCODE) { throw 'v00 failed' }
          pwsh -NoProfile -File scripts/v01/apply-settings.ps1
          if ($LASTEXITCODE) { throw 'v01 settings failed' }
          pwsh -NoProfile -File scripts/v01/apply-gaze-sequential-fixed3.ps1
          if ($LASTEXITCODE) { throw 'v01 gaze/sequential failed' }
          @(
            'scripts/v01/apply-sequential-renderer-fixed2.ps1','scripts/v01/apply-pass2-composite.ps1',
            'scripts/v01/apply-stereo-atlas-fixed2.ps1','scripts/v01/apply-atlas-safety.ps1','scripts/v01/apply-ui.ps1',
            'scripts/v02/apply-gaze-stability.ps1','scripts/v02/apply-atlas-motion-stability.ps1',
            'scripts/v02/apply-pass2-stability.ps1','scripts/v02/apply-sharpening-fixed4.ps1'
          ) | ForEach-Object {
            Write-Host "Applying $_"
            pwsh -NoProfile -File $_
            if ($LASTEXITCODE) { throw "Transform failed: $_" }
          }
          git diff --check
          if ($LASTEXITCODE) { throw 'Inherited transformed source has whitespace errors' }

      - name: Reconstruct retained v03 non-controller changes
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v03/prepare-controller-contract.ps1
          if ($LASTEXITCODE) { throw 'controller contract cleanup failed' }
          pwsh -NoProfile -File scripts/v03/apply-adaptive-relative-crop.ps1
          if ($LASTEXITCODE) { throw 'relative adaptive crop failed' }
          pwsh -NoProfile -File scripts/v03/apply-gaze-fixation-stability.ps1
          if ($LASTEXITCODE) { throw 'gaze fixation stability failed' }
          pwsh -NoProfile -File scripts/v03/apply-sharpness-range.ps1
          if ($LASTEXITCODE) { throw 'extended sharpness failed' }
          git diff --check

      - name: Reconstruct v03 controller substrate
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v03/apply-smart-frametime-controller-fixed.ps1
          if ($LASTEXITCODE) { throw 'v03 controller substrate failed' }
          git diff --check

      - name: Reconstruct v04 atlas-safe controller substrate
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v04/apply-unified-frametime-controller-fixed.ps1
          if ($LASTEXITCODE) { throw 'v04 unified controller failed' }
          pwsh -NoProfile -File scripts/v04/apply-atlas-adaptive-safety.ps1
          if ($LASTEXITCODE) { throw 'v04 atlas adaptive safety failed' }
          git diff --check
          if ($LASTEXITCODE) { throw 'v04 transformed source has whitespace errors' }

      - name: Apply v05 simple crop-first frametime controller
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/v05/apply-simple-frametime-controller-fixed.ps1
          if ($LASTEXITCODE) { throw 'v05 simple controller failed' }
          git diff --check
          if ($LASTEXITCODE) { throw 'v05 transformed source has whitespace errors' }
          git diff --stat

      - name: Verify v05 generated-source invariants
        shell: pwsh
        run: |
          $policy = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/RuntimePolicy.h -Raw
          $fov = Get-Content runtime/open-shaders/src/Features/Upscaling/FoveatedRender.cpp -Raw
          $fovh = Get-Content runtime/open-shaders/src/Features/Upscaling/FoveatedRender.h -Raw
          $crop = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/AdaptiveCropController.h -Raw
          $cropCpp = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/AdaptiveCropController.cpp -Raw
          $integration = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/Integration.cpp -Raw
          $renderer = Get-Content runtime/open-shaders/src/Features/Upscaling/NeuralRendering/Renderer.cpp -Raw
          $gaze = Get-Content runtime/open-shaders/src/Features/Upscaling/GazeCropPolicy.h -Raw
          $shader = Get-Content runtime/open-shaders/features/Upscaling/Shaders/Upscaling/RCAS/RCAS.hlsl -Raw

          foreach ($signature in @(
            'bool FoveatedRender::IsEyeTrackedFoveationEnabled\(\) const',
            'Util::Subrect::UVRegion FoveatedRender::GetEffectiveLeftUV\(\) const',
            'Util::Subrect::UVRegion FoveatedRender::GetEffectiveRightUV\(\) const'
          )) {
            if (([regex]::Matches($fov, "(?m)^$signature\r?\n\{")).Count -ne 1) { throw "Missing or duplicate crop/gaze helper definition: $signature" }
          }

          if ($policy -notmatch 'kFullResolutionNeuralRenderingOnly = false') { throw 'Runtime policy unexpectedly relocked' }
          if ($fovh -notmatch 'neuralRenderingAdaptivePassIncreaseBelowMs = 14\.0f' -or $fovh -notmatch 'adaptiveFilteredFrameTimeMs') { throw 'v05 controller settings/state missing' }
          if ($fov -notmatch '\[DLSSNR\]\[ADAPTIVE-v05\]' -or $fov -notmatch '\[DLSSNR\]\[BUDGET-v05\]') { throw 'v05 controller diagnostics missing' }
          if ($fov -match '\[DLSSNR\]\[ADAPTIVE-v04\]' -or $fov -match '\[DLSSNR\]\[BUDGET-v04\]') { throw 'v04 decision body survived v05' }
          if ($fov -match 'adaptiveController\.Update\(') { throw 'Old model-resolution controller still drives adaptive decisions' }
          if ($fov -match 'Use custom FPS target' -or $fov -match 'Headset refresh target' -or $fov -match 'Estimated DLSS5 NR pass cost') { throw 'Old automatic controller UI survived v05' }
          if ($fov -notmatch 'Pass \+1 below.*10\.0f, 30\.0f' -or $fov -notmatch 'Pass -1 above.*10\.0f, 30\.0f') { throw '10-30 ms threshold controls missing' }
          if ($crop -notmatch 'std::array<std::uint32_t, 3> kCoverageBuckets' -or $crop -notmatch '100, 80, 60') { throw 'Approved 100/80/60 crop ladder missing' }
          if ($crop -match '100, 90, 80, 70, 60, 50') { throw 'Old six-tier crop ladder survived' }
          if ($cropCpp -notmatch 'upshiftFrames, 1u, 240u' -or $cropCpp -notmatch 'minimumDwellFrames, 1u, 600u') { throw 'Hidden crop decision delay survived' }
          if ($fov -notmatch 'base\.w \* scale' -or $fov -notmatch 'base\.h \* scale') { throw 'Relative-to-user-crop scaling regressed' }
          if ($fov -notmatch '(?s)cropAtFloor.*adaptiveActivePasses > 0' -or $fov -notmatch '(?s)cropAtCeiling.*adaptiveActivePasses < adaptiveConfiguredPasses') { throw 'Pass decisions are not crop-endpoint gated' }
          if ($fov -notmatch 'restoringPasses' -or $fov -notmatch 'NeuralRendering::ResetHistory\(\)') { throw 'Pass restoration history protection missing' }
          if ($integration -notmatch 'adaptiveEligible && settings\.neuralRenderingAdaptiveEnabled &&\s*foveated\.adaptivePassInitialized') { throw 'Integration not keyed to v05 controller state' }
          if ($integration -notmatch 'adaptiveActivePasses > 0 \? std::min\(foveated\.adaptiveActivePasses - 1u, 2u\)') { throw 'Adaptive pass wiring missing' }
          if ($integration -notmatch 'adaptiveActivePasses == 0') { throw 'Zero-pass bypass missing' }
          if ($integration -notmatch 'tuning\.modelResolutionPercent = settings\.neuralRenderingModelResolution') { throw 'User-selected NR resolution is not locked during adaptive control' }
          if ($integration -notmatch 'tuning\.adaptiveResolution = false') { throw 'Adaptive model-resolution flag not disabled' }
          if ($integration -notmatch 'tuning\.temporalReuseCadence = 0;\s*\r?\n\s*tuning\.temporalReuseStaggerEyes = false;') { throw 'Atlas temporal safety override missing' }
          if ($renderer -notmatch 'passCount >= 1 && passCount <= 2 && !tuning\.adaptiveResolution') { throw 'Stereo Atlas compatibility guard changed unexpectedly' }
          if ($gaze -notmatch 'microPixels' -or $gaze -match '> 2\.0f\)\s*\r?\n\s*return sample') { throw 'Validated gaze fixation contract regressed' }
          if ($shader -notmatch 'deltaBoost = max\(sharpness, 1\.0\)') { throw 'Extended sharpness mapping regressed' }
          if ($integration -match 'keep cropped/foveated regions on the established single-pass route') { throw 'Old crop/sequential restriction returned' }

      - name: Capture generated v5 patch inputs
        run: |
          python -c "import json,zipfile; from pathlib import Path; paths=json.loads(Path('scripts/v06/source-contract.json').read_text()); z=zipfile.ZipFile('v05-patch-inputs.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p) for p,h in paths.items() if h is not None]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: v05-patch-inputs
          path: v05-patch-inputs.zip
          retention-days: 1

      - name: Apply v06 stability and controller extensions
        shell: pwsh
        run: |
          python scripts/v06/apply-stability.py
          if ($LASTEXITCODE) { throw 'v06 source contract or patch failed' }
          python scripts/v06/apply-headmotion-fix.py
          if ($LASTEXITCODE) { throw 'v06 head-motion contract or patch failed' }
          python scripts/v06/apply-shaking-fix.py
          if ($LASTEXITCODE) { throw 'v06 crop-grid contract or patch failed' }
          python scripts/v06/apply-outside-tone.py
          if ($LASTEXITCODE) { throw 'v06 outside-tone contract or patch failed' }
          python scripts/v06/apply-boundary-tone.py
          if ($LASTEXITCODE) { throw 'v06 boundary-tone contract or patch failed' }
          python scripts/v06/audit-boundary-tone.py
          if ($LASTEXITCODE) { throw 'v06 boundary-tone numerical oracle failed' }
          python scripts/v06/apply-seam-tone.py
          if ($LASTEXITCODE) { throw 'v06 targeted-seam contract or patch failed' }
          python scripts/v06/audit-seam-tone.py
          if ($LASTEXITCODE) { throw 'v06 targeted-seam numerical oracle failed' }
          python scripts/v06/apply-nr-black.py
          if ($LASTEXITCODE) { throw 'v06 inside-NR protection source contract failed' }
          python scripts/v06/audit-nr-black.py
          if ($LASTEXITCODE) { throw 'v06 inside-NR protection or range oracle failed' }


      - name: Permit carrier-excluded package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/v01/permit-carrier-excluded.ps1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify v06 integration and buffer contracts
        shell: pwsh
        run: |
          python scripts/v06/verify-stack.py --write-layout-cpp v06-buffer-layout.cpp
          if ($LASTEXITCODE) { throw 'v06 integration or buffer contract failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX v06-buffer-layout.cpp /Fe:v06-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'v06 buffer layout compilation failed' }
          & ./v06-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'v06 buffer layout verification failed' }

      - name: Compile v06 overlap shaders
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem $sdkBin -Filter fxc.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler unavailable' }
          @(
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/FoveatedRender/CropMotionCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/ResultShapingCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/LadderAtlasGuidesCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/ModelResolutionCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/AlignGuidesCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideToneMapCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideToneSmoothCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideToneApplyCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideSeamMapCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideSeamSmoothCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/NeuralRendering/OutsideSeamApplyCS.hlsl',
            'runtime/open-shaders/features/Upscaling/Shaders/Upscaling/FoveatedRender/SubrectBlendCS.hlsl'
          ) | ForEach-Object {
            & $fxc.FullName /nologo /WX /T cs_5_0 /E main /Fo "$env:RUNNER_TEMP/overlap-check.cso" $_
            if ($LASTEXITCODE) { throw "Overlap shader compilation failed: $_" }
          }

      - name: Execute NR protection and seam shaders on software D3D11
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-nr-black-warp.cpp d3d11.lib d3dcompiler.lib /Fe:nr-black-warp.exe
          if ($LASTEXITCODE) { throw 'NR protection WARP test compilation failed' }
          & ./nr-black-warp.exe
          if ($LASTEXITCODE) { throw 'NR protection shader execution failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-r6-seam-warp.cpp d3d11.lib d3dcompiler.lib /Fe:r6-seam-warp.exe
          if ($LASTEXITCODE) { throw 'r6 seam WARP test compilation failed' }
          & ./r6-seam-warp.exe
          if ($LASTEXITCODE) { throw 'r6 seam shader execution failed' }

      - name: Verify v06 gaze and controller policies
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX /I scripts/v06 scripts/v06/test-policy.cpp runtime/open-shaders/src/Features/Upscaling/NeuralRendering/AdaptiveCropController.cpp /Fe:v06-policy-tests.exe
          if ($LASTEXITCODE) { throw 'v06 policy test compilation failed' }
          & ./v06-policy-tests.exe
          if ($LASTEXITCODE) { throw 'v06 policy tests failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-headmotion.cpp /Fe:v06-headmotion-tests.exe
          if ($LASTEXITCODE) { throw 'v06 head-motion test compilation failed' }
          & ./v06-headmotion-tests.exe
          if ($LASTEXITCODE) { throw 'v06 head-motion tests failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-gaze-grid.cpp /Fe:v06-gaze-grid-tests.exe
          if ($LASTEXITCODE) { throw 'v06 gaze-grid test compilation failed' }
          & ./v06-gaze-grid-tests.exe
          if ($LASTEXITCODE) { throw 'v06 gaze-grid tests failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-outside-tone.cpp /Fe:v06-outside-tone-tests.exe
          if ($LASTEXITCODE) { throw 'v06 outside-tone test compilation failed' }
          & ./v06-outside-tone-tests.exe
          if ($LASTEXITCODE) { throw 'v06 outside-tone tests failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v06/test-seam-ring.cpp /Fe:v06-seam-ring-tests.exe
          if ($LASTEXITCODE) { throw 'v06 seam-ring test compilation failed' }
          & ./v06-seam-ring-tests.exe
          if ($LASTEXITCODE) { throw 'v06 seam-ring coverage tests failed' }

      - name: Apply and audit r7 cleanup and controller
        shell: pwsh
        run: |
          python scripts/v07/apply-r7.py
          if ($LASTEXITCODE) { throw 'r7 exact source patch failed' }
          python scripts/v07/audit-source.py
          if ($LASTEXITCODE) { throw 'r7 integration audit failed' }
          python scripts/v07/verify-stack.py --write-layout-cpp r7-buffer-layout.cpp
          if ($LASTEXITCODE) { throw 'r7 buffer contract failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX r7-buffer-layout.cpp /Fe:r7-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'r7 layout compilation failed' }
          & ./r7-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'r7 layout execution failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v07/test-controller.cpp runtime/open-shaders/src/Features/Upscaling/NeuralRendering/AdaptiveCropController.cpp /Fe:r7-controller.exe
          if ($LASTEXITCODE) { throw 'r7 controller compilation failed' }
          & ./r7-controller.exe
          if ($LASTEXITCODE) { throw 'r7 controller transitions failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v07/test-nr-black-warp.cpp d3d11.lib d3dcompiler.lib /Fe:r7-nr-black-warp.exe
          if ($LASTEXITCODE) { throw 'r7 protection/resume test compilation failed' }
          & ./r7-nr-black-warp.exe
          if ($LASTEXITCODE) { throw 'r7 protection/resume HLSL execution failed' }
          git diff --check
          if ($LASTEXITCODE) { throw 'r7 source whitespace check failed' }

      - name: Apply and verify r10 stable before DLL build
        shell: pwsh
        run: |
          python scripts/v10/apply-r10.py
          if ($LASTEXITCODE) { throw 'r10 exact source patch failed' }
          python scripts/v10/audit-source.py
          if ($LASTEXITCODE) { throw 'r10 source audit failed' }
          python scripts/v10/verify-stack.py --write-layout-cpp r10-buffer-layout.cpp
          if ($LASTEXITCODE) { throw 'r10 integration or CPU/HLSL layout failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX r10-buffer-layout.cpp /Fe:r10-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'r10 buffer layout compilation failed' }
          & ./r10-buffer-layout.exe
          if ($LASTEXITCODE) { throw 'r10 buffer layout execution failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v10/test-controller.cpp runtime/open-shaders/src/Features/Upscaling/NeuralRendering/AdaptiveCropController.cpp /Fe:r10-controller.exe
          if ($LASTEXITCODE) { throw 'r10 controller compilation failed' }
          & ./r10-controller.exe
          if ($LASTEXITCODE) { throw 'r10 controller transitions failed' }
          cl /nologo /std:c++20 /EHsc /W4 /WX scripts/v10/test-atlas-warp.cpp d3d11.lib d3dcompiler.lib /Fe:r10-atlas-warp.exe
          if ($LASTEXITCODE) { throw 'r10 fused atlas WARP compilation failed' }
          & ./r10-atlas-warp.exe
          if ($LASTEXITCODE) { throw 'r10 fused atlas differs from r7 shader outputs' }
          git diff --check
          if ($LASTEXITCODE) { throw 'r10 whitespace check failed' }

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Verify full runtime source contracts
        shell: pwsh
        run: |
          cmake "-DSOURCE_ROOT=$env:GITHUB_WORKSPACE/runtime/open-shaders" -P runtime/open-shaders/cmake/ValidateOpenNRSourceContracts.cmake
          if ($LASTEXITCODE) { throw 'Full runtime source contracts failed' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git checkout $baseline
          & .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and package
        shell: pwsh
        working-directory: runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          cmake --preset OpenNR-Package "-DDIST_PATH=$dist"
          cmake --build --preset Package --parallel

      - name: Add v06 package notes and hashes
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist -Filter '*.7z')
          if ($archives.Count -ne 1) { throw 'Expected one runtime archive' }
          Rename-Item $archives[0].FullName 'OpenNR-2.20.1-v06-r10-stable.7z'
          Copy-Item docs/versions/2.20.1-v06/r10/README.md dist/README-r10-stable.txt
          Copy-Item docs/versions/2.20.1-v06/r10/REVIEW.md dist/REVIEW-r10-stable.md
          Get-ChildItem -Recurse dist -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash)  $($_.FullName)"
          } | Tee-Object -FilePath dist/SHA256SUMS.txt

      - name: Upload v06 checkpoint package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-2.20.1-v06-r10-stable-carrier-excluded
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Download compiled r6 baseline for audit
        uses: actions/download-artifact@v4
        with:
          name: OpenNR-2.20.1-v06-r6-inside-black-protection-carrier-excluded
          run-id: 37420891871
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/r6

      - name: Audit compiled r10 stable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/r10 | Out-Null
          Copy-Item dist/*.7z artifacts/r10/
          python scripts/v10/audit-package.py
          if ($LASTEXITCODE) { throw 'r10 package regression audit failed' }

      - name: Upload r10 package audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-v06-r10-stable-package-audit
          path: audit-results/*
          if-no-files-found: error
          retention-days: 14

